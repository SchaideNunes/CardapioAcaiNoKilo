<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Montagem em stories</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Raleway:wght@500;700;800&display=swap');
  :root{--ground:#241220;--panel:#2f1729;--ink:#120714;--gold:#F0DF58;--orange:#F58220;--cream:#F8EEA6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:390px;height:844px;background:var(--ground);color:#fff;font-family:Raleway,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .bars{display:flex;gap:4px;padding:14px 16px 0}
  .bars i{flex:1;height:5px;border-radius:99px;background:#ffffff26}
  .bars i.done{background:var(--gold)} .bars i.now{background:linear-gradient(90deg,var(--gold) 55%,#ffffff26 55%)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  header img{height:38px}
  .total{background:var(--gold);color:var(--ink);font-family:'Bebas Neue';font-size:24px;padding:4px 14px 2px;border-radius:99px;border:2px solid var(--ink)}
  .step{padding:8px 16px 0}
  .kicker{font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
  h1{font-family:'Bebas Neue';font-size:64px;line-height:.9;margin-top:6px}
  .hint{color:#ffffffb3;font-size:14px;margin-top:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:22px 16px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:10px}
  .sticker{width:148px;height:148px;border-radius:50%;overflow:hidden;border:5px solid var(--cream);background:var(--panel)}
  .sticker img{width:100%;height:100%;object-fit:cover;transform:scale(1.4)}
  .opt.on .sticker{border-color:var(--gold);outline:4px solid var(--ink);outline-offset:-1px}
  .label{font-weight:700;font-size:15px;padding:6px 14px;border-radius:99px;border:2px solid #ffffff33}
  .opt.on .label{background:var(--gold);color:var(--ink);border-color:var(--ink)}
  footer{margin-top:auto;padding:14px 16px 26px;display:flex;gap:10px}
  .back{width:58px;height:58px;border-radius:99px;border:2px solid #ffffff40;display:grid;place-items:center;font-size:22px}
  .next{flex:1;height:58px;border-radius:99px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);font-family:'Bebas Neue';font-size:28px;display:flex;align-items:center;justify-content:center;gap:8px}
</style></head>
<body>
  <div class="bars"><i class="done"></i><i class="now"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <header><img src="../../../public/assets/Logo açai.webp" alt="Açaí no Kilo"><span class="total">R$ 17,00</span></header>
  <section class="step">
    <p class="kicker">Passo 2 · Pote de 500</p>
    <h1>Qual sabor<br>de açaí?</h1>
    <p class="hint">Toque para escolher um.</p>
  </section>
  <div class="grid">
    <div class="opt on"><div class="sticker"><img src="../../../public/assets/items/f_natural.webp" alt=""></div><span class="label">Natural</span></div>
    <div class="opt"><div class="sticker"><img src="../../../public/assets/items/f_banana.webp" alt=""></div><span class="label">Banana</span></div>
    <div class="opt"><div class="sticker"><img src="../../../public/assets/items/f_morango.webp" alt=""></div><span class="label">Morango</span></div>
    <div class="opt"><div class="sticker"><img src="../../../public/assets/items/f_diet.webp" alt=""></div><span class="label">Diet</span></div>
  </div>
  <footer><span class="back">←</span><span class="next">Próximo: coberturas →</span></footer>
</body></html>
